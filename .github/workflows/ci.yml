# Continuous Integration: every push and pull request to main/develop must pass these checks.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway PostgreSQL 18 for the integration tests. GitHub starts it before the steps run and
    # deletes it afterwards. Same image and credentials as docker-compose.yml; the database is the
    # test database the integration tests connect to by default.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devconnect
          POSTGRES_PASSWORD: devconnect
          POSTGRES_DB: devconnect_test
        ports:
          - 5432:5432
        # The steps wait until Postgres reports healthy.
        options: >-
          --health-cmd "pg_isready -U devconnect -d devconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm (version taken from "packageManager" in package.json)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version taken from .nvmrc) with a pnpm download cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies exactly as locked
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Regenerate migrations from src/db/schema. If a new file appears, someone changed the schema
      # without generating and committing its migration.
      - name: Check that the migrations match the schema
        run: |
          pnpm db:generate
          git status --porcelain apps/api/src/db/migrations
          test -z "$(git status --porcelain apps/api/src/db/migrations)"

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL 18)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Fails on any known vulnerability that isn't reviewed and listed in pnpm-workspace.yaml
      # (docs/adr/0008). Last, so a new advisory doesn't hide the other results.
      - name: Audit dependencies
        run: pnpm audit
